# Example templates used to try out the templates page.
# They only log the input, see examples/template for one that publishes.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: java-backend
  title: Java Backend
  description: Microserviço REST com Spring Boot, autenticação, testes e observabilidade configurados.
  tags:
    - rest
    - maven
    - docker
  annotations:
    devportal.io/stack: Java 21 · Spring Boot
    devportal.io/version: v2.1.0
spec:
  owner: group:default/team-backend
  type: service
  parameters:
    - title: Informações do componente
      required:
        - name
      properties:
        name:
          title: Nome
          type: string
          description: Nome único do componente
          ui:autofocus: true
  steps:
    - id: log
      name: Registrar entrada
      action: debug:log
      input:
        message: Criando ${{ parameters.name }} a partir de Java Backend

