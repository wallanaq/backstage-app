---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: notification-samples
  title: Generate test notifications
  description: Sends sample notifications (different severities, topics and links) to all users.
  tags:
    - test
    - notifications
  annotations:
    devportal.io/stack: Backstage · Notifications
    devportal.io/version: v0.1.0
spec:
  owner: group:default/team-platform
  type: other
  parameters:
    - title: Confirmation
      properties:
        confirm:
          title: Send the test notifications
          type: boolean
          default: true
          description: Creates 6 broadcast notifications, visible to all users.
  steps:
    - id: notify-critical
      name: "Deploy of playback-order failed"
      action: notification:send
      input:
        recipients: broadcast
        title: "Deploy of playback-order failed"
        info: "The production pipeline failed at the database migration step. The previous version is still running."
        link: "/catalog/default/component/playback-order"
        severity: critical
        topic: "Deploy"
        scope: devportal-test-critical
    - id: notify-high
      name: "TLS certificate expires in 7 days"
      action: notification:send
      input:
        recipients: broadcast
        title: "TLS certificate expires in 7 days"
        info: "The certificate of the api.example.com domain must be renewed before it expires."
        link: "https://backstage.io/docs"
        severity: high
        topic: "Security"
        scope: devportal-test-high
    - id: notify-normal
      name: "New template available: Go Library"
      action: notification:send
      input:
        recipients: broadcast
        title: "New template available: Go Library"
        info: "The platform team published a template for Go libraries with CI and semantic versioning."
        link: "/create/templates/default/go-library"
        severity: normal
        topic: "Templates"
        scope: devportal-test-normal
    - id: notify-docs
      name: "podcast-api documentation updated"
      action: notification:send
      input:
        recipients: broadcast
        title: "podcast-api documentation updated"
        info: "The architecture page was reviewed and now includes the dependency diagram."
        link: "/docs"
        severity: low
        topic: "Documentation"
        scope: devportal-test-docs
    - id: notify-plain
      name: "Welcome to DevPortal"
      action: notification:send
      input:
        recipients: broadcast
        title: "Welcome to DevPortal"
        info: "Explore the catalog, the APIs and the templates. This notification has no link."
        severity: normal
        topic: "General"
        scope: devportal-test-plain
    - id: notify-review
      name: "Pending review on hello-world"
      action: notification:send
      input:
        recipients: broadcast
        title: "Pending review on hello-world"
        info: "There are 3 comments waiting for a reply on the component review."
        link: "/catalog/default/component/hello-world"
        severity: low
        topic: "Reviews"
        scope: devportal-test-review
