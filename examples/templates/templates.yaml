# Example templates used to try out the templates page.
# They only log the input, see examples/template for one that publishes.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: java-backend
  title: Java Backend
  description: REST microservice with Spring Boot, authentication, tests and observability set up.
  tags:
    - rest
    - maven
    - docker
  annotations:
    devportal.io/stack: Java 21 · Spring Boot
    devportal.io/version: v2.1.0
spec:
  owner: group:default/team-backend
  type: service
  parameters:
    - title: Component information
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
  steps:
    - id: log
      name: Log input
      action: debug:log
      input:
        message: Creating ${{ parameters.name }} from Java Backend

