---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: notification-samples
  title: Gerar notificações de teste
  description: Envia notificações de exemplo (diferentes severidades, tópicos e links) para todos os usuários.
  tags:
    - teste
    - notificacoes
  annotations:
    devportal.io/stack: Backstage · Notificações
    devportal.io/version: v0.1.0
spec:
  owner: group:default/team-platform
  type: other
  parameters:
    - title: Confirmação
      properties:
        confirm:
          title: Enviar as notificações de teste
          type: boolean
          default: true
          description: Cria 6 notificações de broadcast, visíveis para todos os usuários.
  steps:
    - id: notify-critical
      name: "Falha no deploy de playback-order"
      action: notification:send
      input:
        recipients: broadcast
        title: "Falha no deploy de playback-order"
        info: "O pipeline de produção falhou na etapa de migração do banco. A versão anterior continua no ar."
        link: "/catalog/default/component/playback-order"
        severity: critical
        topic: "Deploy"
        scope: devportal-test-critical
    - id: notify-high
      name: "Certificado TLS expira em 7 dias"
      action: notification:send
      input:
        recipients: broadcast
        title: "Certificado TLS expira em 7 dias"
        info: "O certificado do domínio api.example.com precisa ser renovado antes do vencimento."
        link: "https://backstage.io/docs"
        severity: high
        topic: "Segurança"
        scope: devportal-test-high
    - id: notify-normal
      name: "Novo template disponível: Go Library"
      action: notification:send
      input:
        recipients: broadcast
        title: "Novo template disponível: Go Library"
        info: "A equipe de plataforma publicou um template para bibliotecas Go com CI e versionamento semântico."
        link: "/create/templates/default/go-library"
        severity: normal
        topic: "Templates"
        scope: devportal-test-normal
    - id: notify-docs
      name: "Documentação de podcast-api atualizada"
      action: notification:send
      input:
        recipients: broadcast
        title: "Documentação de podcast-api atualizada"
        info: "A página de arquitetura foi revisada e agora inclui o diagrama de dependências."
        link: "/docs"
        severity: low
        topic: "Documentação"
        scope: devportal-test-docs
    - id: notify-plain
      name: "Bem-vindo ao DevPortal"
      action: notification:send
      input:
        recipients: broadcast
        title: "Bem-vindo ao DevPortal"
        info: "Explore o catálogo, as APIs e os templates. Esta notificação não tem link."
        severity: normal
        topic: "Geral"
        scope: devportal-test-plain
    - id: notify-review
      name: "Revisão pendente em hello-world"
      action: notification:send
      input:
        recipients: broadcast
        title: "Revisão pendente em hello-world"
        info: "Há 3 comentários aguardando resposta na revisão do componente."
        link: "/catalog/default/component/hello-world"
        severity: low
        topic: "Revisões"
        scope: devportal-test-review
