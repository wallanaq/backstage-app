# istiod in ambient mode (https://istio.io/latest/docs/ambient/install/helm/).
profile: ambient

# Istio only serves the experimental Gateway API kinds (TCPRoute) with this flag.
env:
  PILOT_ENABLE_ALPHA_GATEWAY_API: 'true'

# One replica is enough for the lab; the default autoscaling (1-5) is not.
autoscaleEnabled: false
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
