# Keycloak of the lab: identity provider of Backstage (and of the tools to come).
#
#   from the host and the browser:  http://keycloak.k8s.orb.local (HTTPRoute on istio-gateway)
#   in the cluster:                  keycloak.keycloak.svc.cluster.local:8080
#
# The realm "backstage" comes from the ConfigMap keycloak-realm, which the Makefile builds from
# realm-backstage.json. The database is the shared Postgres (role and database "keycloak").
# Lab credentials are plain on purpose and there is no TLS.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
# Credentials of the role "keycloak" of the shared Postgres (the same values as the Secret
# postgres-keycloak, which lives in another namespace), and of the master realm admin.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: keycloak
type: Opaque
stringData:
  db-username: keycloak
  db-password: changeme
  admin-username: admin
  admin-password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # Kept in sync with KEYCLOAK_VERSION in the Makefile.
          image: quay.io/keycloak/keycloak:26.8.0
          args:
            - start
            - --import-realm
            - --http-enabled=true
            - --hostname=http://keycloak.k8s.orb.local
            - --proxy-headers=xforwarded
            - --cache=local
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: db-username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: db-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 1536Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - keycloak.k8s.orb.local
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
