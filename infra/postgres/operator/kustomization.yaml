# CloudNativePG operator: the official release manifest, with explicit resources.
# To upgrade, change the version in the URL (the CRDs are large: apply with --server-side).
#
#   kubectl apply --server-side --force-conflicts -k infra/postgres/operator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
patches:
  - target:
      kind: Deployment
      name: cnpg-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
