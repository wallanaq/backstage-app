# The shared Postgres of the lab. Other tools (Keycloak, ...) get their own role and
# database here instead of running their own Postgres.
#
#   in the cluster:  postgres-rw.postgres.svc.cluster.local:5432
#   from the host:   postgres.k8s.orb.local:5432 (TCPRoute on istio-gateway)
# In the Istio ambient mesh: ztunnel gives the instance mTLS (HBONE) and L4 telemetry, with no
# restart. The CloudNativePG operator stays outside the mesh (namespace cnpg-system) and its calls
# to the instance are still accepted as plain traffic: ztunnel is permissive, and a STRICT
# PeerAuthentication here would reject the operator. To leave the mesh, remove the label
# (kubectl label namespace postgres istio.io/dataplane-mode-).
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
  labels:
    istio.io/dataplane-mode: ambient
---
# Lab credentials are plain on purpose. The label makes the operator reload the managed
# role when the Secret changes; without it a role whose Secret did not exist when the
# Cluster was applied stays pending forever.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backstage
  namespace: postgres
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: backstage
  password: changeme
---
# Keycloak's role (same plain credentials as above, copied to the keycloak namespace by infra/keycloak).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-keycloak
  namespace: postgres
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: changeme
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 1
  enableSuperuserAccess: true
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  postgresql:
    parameters:
      # Backstage keeps a connection pool per plugin database.
      max_connections: '200'
  managed:
    roles:
      # Backstage creates one database per plugin (backstage_plugin_*).
      - name: backstage
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: postgres-backstage
      # Keycloak keeps everything in one database, created below.
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: postgres-keycloak
---
# Declarative database of Keycloak (CNPG Database resource).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: postgres
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: postgres
